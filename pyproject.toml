[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-x"
version = "0.1.0"
description = "Decentralized Adaptive Flow-Field Swarm Coordination Engine"
authors = [
    {name = "SWARM-X Team", email = "contact@swarm-x.org"}
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Simulation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "networkx>=3.2",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
swarm-x = "app:main"
benchmark = "benchmark:main"
optimizer = "optimizer:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "W", "C90"]
ignore = []

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["swarm_x", "swarm_x.*"]